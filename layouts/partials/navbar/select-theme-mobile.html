{{ if $.Param "enableThemeChange" }}
{{ if gt (len .Site.Data.theme.themes) 1 }}
{{/*
<div class="theme theme-mobile" data-ani="{{ $.Site.Params.enableUiAnimation | default "true" }}">
*/}}
<div class="navbar-selector navbar-theme-selector-mobile" data-ani="{{ $.Site.Params.enableUiAnimation | default "true" }}">
  <div class="dropdown">
    <button class="dropdown-trigger navbar__slide-down" onclick="toggleMenu(this.parentElement,event)" aria-label="Select Theme Button" data-ani="{{ $.Site.Params.enableUiAnimation | default "true" }}">
      {{/*
      {{ partial "svgs/etc/invert-colors.svg" (dict "width" 22 "height" 22) }}      
      */}}
      {{ partial "svgs/etc/palette-solid.svg" }}
    </button>
    <div class="dropdown-content select-theme">
      {{ if .Site.Data.theme.themes }}
        {{ range $index, $value := .Site.Data.theme.themes }}
          <a href="#" title="{{ $value.name }}" class="dropdown-item select-theme__item {{ if (eq $index 0) }}is-active{{ end }}">
            {{ $value.label }}
          </a>
        {{ end }}
      {{ end }}
    </div>
  </div>
</div>
{{ end }}
{{ end }}
