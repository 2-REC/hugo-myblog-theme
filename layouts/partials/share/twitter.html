{{ $ctx := .ctx }}
{{ $share := .share }}
<a class="action__item" data-type="share" target="_blank" rel="noreferrer"
    href="https://x.com/intent/tweet?text={{ $ctx.Title }}&url={{ $ctx.Permalink | absLangURL }}{{ with $ctx.Params.tags }}&hashtags={{ delimit . "," }}{{ end }}&via={{ $share.username | default $ctx.Params.author }}"
    title="X"
    aria-label="X Share Button">
  <i aria-hidden="true" class="share--twitter">{{ partial "svgs/share/x.svg" (dict "width" 35 "height" 35) }}</i>
</a>
